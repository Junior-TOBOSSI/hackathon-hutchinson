# Station "dataset_5S": 5S workbench, top view (dataset_5S_80_496x325, synthetic prototype).
# THE reference data for the workstation use case from 2026-11-26.
#
# The dataset mixes TWO camera framings: A (sharp, like the provided reference) and B
# (closer, blurry, with a green bin and a cable on the bench as normal content). A photo of
# framing B cannot be aligned on reference A (too few common keypoints), so each framing
# has its own reference and its own boxes. The analyzer uses the view that aligns best.
# View B uses good/good_017.png as reference: that image is EXCLUDED from the evaluation.
#
# Paths are relative to --data-root. Coordinates are NORMALIZED [x, y] on each reference.
# Zones ("empty_zones"): nothing may appear there compared with the reference
#   - zone_interdite  : red hatched area, neither object nor person
#   - plan_de_travail : bench top, nothing left on it (5S "disorder")
# Slots ("element_slots"): each tool group of the shadow board must stay in its place.
name: dataset_5s
dataset: raw/workstation/dataset_5S_80_496x325
exclude_from_eval: [good/good_017.png]
views:
  # Framing A: the reference provided with the dataset
  - name: A
    reference_image: raw/workstation/dataset_5S_80_496x325/reference/reference.png
    empty_zones:
      zone_interdite: [[0.754, 0.237], [0.933, 0.237], [0.988, 0.911], [0.766, 0.911]]
      plan_de_travail: [[0.127, 0.283], [0.746, 0.283], [0.750, 0.542], [0.123, 0.545]]
    element_slots:
      cles: [[0.302, 0.086], [0.433, 0.086], [0.433, 0.215], [0.302, 0.215]]
      tournevis: [[0.452, 0.123], [0.532, 0.123], [0.532, 0.215], [0.452, 0.215]]
      tournevis_courts: [[0.383, 0.191], [0.448, 0.191], [0.448, 0.265], [0.383, 0.265]]
      pinces: [[0.540, 0.111], [0.597, 0.111], [0.597, 0.252], [0.540, 0.252]]
      marteau: [[0.605, 0.102], [0.645, 0.102], [0.645, 0.246], [0.605, 0.246]]
      metre: [[0.649, 0.169], [0.681, 0.169], [0.681, 0.240], [0.649, 0.240]]
  # Framing B: a conforming photo of that framing
  - name: B
    reference_image: raw/workstation/dataset_5S_80_496x325/good/good_017.png
    empty_zones:
      zone_interdite: [[0.806, 0.222], [0.954, 0.222], [0.988, 0.969], [0.812, 0.969]]
      plan_de_travail: [[0.091, 0.326], [0.786, 0.320], [0.790, 0.714], [0.081, 0.723]]
    element_slots:
      cles: [[0.258, 0.092], [0.393, 0.092], [0.393, 0.246], [0.258, 0.246]]
      tournevis: [[0.419, 0.092], [0.508, 0.092], [0.508, 0.277], [0.419, 0.277]]
      tournevis_courts: [[0.339, 0.215], [0.407, 0.215], [0.407, 0.323], [0.339, 0.323]]
      pinces: [[0.520, 0.086], [0.595, 0.086], [0.595, 0.292], [0.520, 0.292]]
      marteau: [[0.601, 0.068], [0.641, 0.068], [0.641, 0.246], [0.601, 0.246]]
      metre: [[0.655, 0.169], [0.696, 0.169], [0.696, 0.262], [0.655, 0.262]]
