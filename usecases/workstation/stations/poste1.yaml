# Station 1: capture of the client's current system (plunging view over a machine).
# Coordinates are NORMALIZED [x, y] on the CLEAN reference image (after clean_capture).
# Redraw them with: python -m usecases.workstation.draw_zones --image <reference.png>
name: poste1
source: raw/workstation/poste1_capture.png   # relative to --data-root
prepare: clean_capture                        # clean_capture | copy

# Zones that must contain neither object nor person.
empty_zones:
  passage: [[0.50, 0.42], [0.84, 0.42], [0.70, 0.80], [0.44, 0.86]]

# Place of each element on the reference: if it changes, the element is not in its place.
element_slots:
  crates: [[0.11, 0.79], [0.26, 0.79], [0.26, 0.99], [0.11, 0.99]]
  barrier: [[0.87, 0.43], [1.0, 0.43], [1.0, 0.81], [0.87, 0.81]]
  yellow_guard: [[0.71, 0.81], [0.90, 0.81], [0.90, 1.0], [0.71, 1.0]]
  racks: [[0.80, 0.0], [1.0, 0.0], [1.0, 0.42], [0.80, 0.42]]
