# Section "Press cell" (poste_5s_11, synthetic pilot, labels indicative).
# Blue press with a tool bench. The blue mat in front of the press must stay
# clear during the start-of-shift check (rule to be confirmed by the client).
#
# Paths are relative to --data-root. Coordinates are NORMALIZED [x, y] on the reference.
# empty_zones  : nothing new may appear there (objects, and persons unless allowed)
# element_slots: each element must stay in its place; they are the boxes shown on photos
name: press_cell
title: Press cell
dataset: raw/workstation/poste_5s_11
# Columns of labels.csv: file path, class (reference / good / anomaly), anomaly type.
labels: {file: file, label: label, type: intended_anomaly}
# Where each anomaly type must be found: a zone name, null (anything outside the
# zones named here: bench, slots) or any (any finding).
anomaly_types:
  missing_object: null
  displaced_object: any
  disorder: null
  object_intrusion: blue_mat
  person_intrusion: blue_mat
views:
  - name: main
    reference_image: raw/workstation/poste_5s_11/reference.png
    empty_zones:
      blue_mat: [[0.508, 0.603], [0.609, 0.606], [0.702, 0.760], [0.603, 0.920], [0.425, 0.748]]
      workbench: [[0.000, 0.271], [0.192, 0.191], [0.373, 0.222], [0.403, 0.323], [0.262, 0.508], [0.081, 0.600], [0.000, 0.631]]
    element_slots:
      tool_tray: [[0.202, 0.191], [0.373, 0.191], [0.373, 0.354], [0.202, 0.354]]
      blue_bin: [[0.000, 0.283], [0.125, 0.283], [0.125, 0.455], [0.000, 0.455]]
      shelf_blue_bin: [[0.202, 0.538], [0.302, 0.538], [0.302, 0.692], [0.202, 0.692]]
      yellow_bin: [[0.040, 0.646], [0.151, 0.646], [0.151, 0.831], [0.040, 0.831]]
