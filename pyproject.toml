[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visionhub"
version = "0.1.0"
description = "Multi-model industrial vision platform (ESIGELEC x Hutchinson hackathon)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.37"]
dev = ["pytest>=8.0", "ruff>=0.4"]
# Heavy model dependencies: NOT installed by default, the demo never needs them.
quality = ["anomalib>=1.1"]
workstation = ["ultralytics>=8.2"]
safety = ["ultralytics>=8.2"]

[tool.setuptools.packages.find]
include = ["visionhub*", "usecases*"]

[tool.setuptools.package-data]
usecases = ["*/config.yaml"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -q"
testpaths = ["tests", "usecases"]

[tool.ruff]
line-length = 100
target-version = "py311"
# kit_integration_qualite702: standalone quality kit (branch quality), not loaded by the platform
extend-exclude = ["usecases/*/notebooks", "kit_integration_qualite702"]

[tool.ruff.format]
# Do not reformat code snippets inside documentation.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI idiom: File(...) / Query(...) as parameter defaults.
extend-immutable-calls = ["fastapi.File", "fastapi.Query"]
